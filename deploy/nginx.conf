server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html index.php;

    # Gzip para performance
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache de assets estáticos (30 dias)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|mp4|webp|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Widget raspadinha — cache agressivo no Nginx (serve sem tocar PHP)
    location = /index.html {
        expires 5m;
        add_header Cache-Control "public";
        add_header X-Frame-Options "";
        add_header Content-Security-Policy "frame-ancestors *;";
        add_header Access-Control-Allow-Origin "*";
    }

    # Hub administrativo
    location /hub/ {
        try_files $uri $uri/ /hub/index.html;
        expires 5m;
        add_header Cache-Control "public";
    }

    # API — PHP-FPM
    location /api/ {
        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-Api-Token, Token, X-Admin-Token, X-Debug-Workspace, X-Workspace" always;
        add_header X-Frame-Options "" always;
        add_header Content-Security-Policy "frame-ancestors *;" always;

        # Preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-Api-Token, Token, X-Admin-Token, X-Debug-Workspace, X-Workspace";
            add_header Content-Length 0;
            return 204;
        }

        # Tenta arquivo direto, senão vai pro index.php da API
        try_files $uri $uri/ /api/index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 30s;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 16 16k;
        }
    }

    # Webhook — endpoint crítico, sem cache
    location /api/webhook.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # Bloqueia acesso a pastas sensíveis
    location ~ ^/(config|migrations|scripts|src|storage|\.env|\.git) {
        deny all;
        return 403;
    }

    # PHP genérico (fallback)
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Fallback geral
    location / {
        try_files $uri $uri/ /index.html;
    }
}
