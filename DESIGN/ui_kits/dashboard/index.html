<link rel="icon" href="../../assets/app-icon-180.png">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>html,body{margin:0}#root{min-height:100vh}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="./AppShell.jsx"></script>
<script type="text/babel" src="./DashboardHome.jsx"></script>
<script type="text/babel" src="./AiAssistant.jsx"></script>
<script type="text/babel" src="./Transactions.jsx"></script>
<script type="text/babel" src="./Wallet.jsx"></script>
<script type="text/babel" data-presets="react">
const { Button } = window.UpscaleHubDesignSystem_b4eac1;
function App(){
  const [page,setPage]=React.useState(()=>localStorage.getItem('fynix.page')||'dash');
  React.useEffect(()=>{localStorage.setItem('fynix.page',page)},[page]);
  const actions = page==='ai'
    ? <><Button size="sm" variant="ghost" icon="download">Export</Button><Button size="sm" variant="soft" icon="sparkles">Get Plus</Button></>
    : null;
  const view = page==='dash' ? <window.DashboardHome onNavigate={setPage}/>
    : page==='ai' ? <window.AiAssistant/>
    : page==='tx' ? <window.Transactions/>
    : page==='wallet' ? <window.Wallet/>
    : <window.Placeholder title={({inv:'Invoices',rep:'Reports',set:'Settings',help:'Help Center'})[page]}/>;
  return <window.AppShell page={page} onNavigate={setPage} actions={actions}>{view}</window.AppShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
