<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-canvas)}body{padding:16px}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;align-content:end;gap:2px;padding:8px;border-radius:var(--radius-sm);min-height:74px}.hx{font:var(--weight-semibold) 10px/1.3 var(--font-accent);letter-spacing:.02em}.nm{font:var(--weight-medium) 10px/1.3 var(--font-ui);opacity:.72}.cap{font:var(--type-caption);color:var(--text-subtle)}</style></head><body><div style="display:flex;height:160px;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-canvas)">

<div style="border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;padding:0 12px"><span class="nm">--topbar-height 56</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:12px"><div style="background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--radius-card)"></div><div style="background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--radius-card)"></div><div style="background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--radius-card);display:grid;place-items:center"><span class="nm">gap 12</span></div></div>
</div></div></body></html>
