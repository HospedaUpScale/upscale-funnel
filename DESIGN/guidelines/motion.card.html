<!-- @dsCard group="Spacing" viewport="700x170" name="Motion" subtitle="Fast, short, decelerating; press shrinks to 0.975" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-canvas)}body{padding:16px}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;align-content:end;gap:2px;padding:8px;border-radius:var(--radius-sm);min-height:74px}.hx{font:var(--weight-semibold) 10px/1.3 var(--font-accent);letter-spacing:.02em}.nm{font:var(--weight-medium) 10px/1.3 var(--font-ui);opacity:.72}.cap{font:var(--type-caption);color:var(--text-subtle)}</style></head><body><style>@keyframes fxslide{0%,100%{transform:translateX(0)}50%{transform:translateX(120px)}}</style><div class="g">
<div style="display:flex;align-items:center;gap:12px"><span class="nm" style="width:190px">--duration-fast 140ms</span><div style="flex:1;height:24px;background:var(--gray-150);border-radius:var(--radius-pill);position:relative;overflow:hidden"><span style="position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:var(--radius-pill);background:var(--blue-600);animation:fxslide 1.4s var(--ease-standard) infinite"></span></div></div><div style="display:flex;align-items:center;gap:12px"><span class="nm" style="width:190px">--duration-normal 220ms</span><div style="flex:1;height:24px;background:var(--gray-150);border-radius:var(--radius-pill);position:relative;overflow:hidden"><span style="position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:var(--radius-pill);background:var(--blue-600);animation:fxslide 2.2s var(--ease-out) infinite"></span></div></div><div style="display:flex;align-items:center;gap:12px"><span class="nm" style="width:190px">--duration-slow 360ms</span><div style="flex:1;height:24px;background:var(--gray-150);border-radius:var(--radius-pill);position:relative;overflow:hidden"><span style="position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:var(--radius-pill);background:var(--blue-600);animation:fxslide 3.6s var(--ease-spring) infinite"></span></div></div>
<span class="cap">--ease-standard cubic-bezier(.32,.72,0,1) &middot; --ease-out (.16,1,.3,1) &middot; --ease-spring (.34,1.32,.64,1)</span>
</div></body></html>
