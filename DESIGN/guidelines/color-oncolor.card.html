<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-canvas)}body{padding:16px}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;align-content:end;gap:2px;padding:8px;border-radius:var(--radius-sm);min-height:74px}.hx{font:var(--weight-semibold) 10px/1.3 var(--font-accent);letter-spacing:.02em}.nm{font:var(--weight-medium) 10px/1.3 var(--font-ui);opacity:.72}.cap{font:var(--type-caption);color:var(--text-subtle)}</style></head><body><div class="r">
<div style="flex:1;display:grid;gap:6px;padding:16px;border-radius:var(--radius-md);background:var(--surface-brand)"><span style="font:var(--weight-semibold) var(--text-md)/1.2 var(--font-ui);color:var(--text-on-brand)">Total Balance</span><span style="font:var(--type-body-sm);color:rgba(255,255,255,.78)">--text-on-brand &middot; #FFFFFF</span></div>

</div></body></html>
