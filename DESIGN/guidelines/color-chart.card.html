<!-- @dsCard group="Colors" viewport="700x150" name="Chart palette" subtitle="Series order: brand blue first, lime second — never more than five" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-canvas)}body{padding:16px}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;align-content:end;gap:2px;padding:8px;border-radius:var(--radius-sm);min-height:74px}.hx{font:var(--weight-semibold) 10px/1.3 var(--font-accent);letter-spacing:.02em}.nm{font:var(--weight-medium) 10px/1.3 var(--font-ui);opacity:.72}.cap{font:var(--type-caption);color:var(--text-subtle)}</style></head><body><div class="r" style="gap:6px">
<div class="sw" style="background:var(--chart-1);color:#FFFFFF;flex:1"><span class="nm">--chart-1 &middot; income</span></div>
<div class="sw" style="background:var(--chart-2);color:#05153F;flex:1"><span class="nm">--chart-2 &middot; expense</span></div>
<div class="sw" style="background:var(--chart-3);color:#FFFFFF;flex:1"><span class="nm">--chart-3 &middot; ink</span></div>
<div class="sw" style="background:var(--chart-4);color:#05153F;flex:1"><span class="nm">--chart-4 &middot; pale</span></div>
<div class="sw" style="background:var(--chart-5);color:#05153F;flex:1"><span class="nm">--chart-5 &middot; rest</span></div>
</div></body></html>
