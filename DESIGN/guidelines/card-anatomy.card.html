<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-canvas)}body{padding:16px}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;align-content:end;gap:2px;padding:8px;border-radius:var(--radius-sm);min-height:74px}.hx{font:var(--weight-semibold) 10px/1.3 var(--font-accent);letter-spacing:.02em}.nm{font:var(--weight-medium) 10px/1.3 var(--font-ui);opacity:.72}.cap{font:var(--type-caption);color:var(--text-subtle)}</style></head><body><div class="r" style="gap:12px;align-items:stretch">

<div style="font:700 24px/1 var(--font-ui);font-variant-numeric:tabular-nums">$562,000</div>

</div>
<div style="flex:1;padding:16px;border-radius:16px;background:var(--gradient-brand);box-shadow:var(--shadow-brand);display:grid;align-content:space-between">
<div><div style="font:500 13px/1 var(--font-ui);color:rgba(255,255,255,.86)">Total Balance</div><div style="font:700 32px/1.2 var(--font-ui);letter-spacing:-.02em;color:var(--white)">$20,670</div></div>
<div style="display:flex;gap:8px"><span style="flex:1;height:36px;border-radius:999px;background:var(--white);display:grid;place-items:center;font:600 13px/1 var(--font-ui);color:var(--ink-900)">Deposit</span><span style="flex:1;height:36px;border-radius:999px;background:var(--ink-900);color:var(--white);display:grid;place-items:center;font:600 13px/1 var(--font-ui)">Send</span></div>
</div>
<div style="flex:1;padding:16px;border-radius:16px;background:var(--gradient-ink);color:var(--white);display:grid;gap:8px;align-content:start;box-shadow:var(--shadow-md)">
<span style="font:var(--type-card-title);color:var(--white)">Inverse</span>
<span style="font:var(--type-body-sm);color:var(--ink-300)">Ink gradient panel for emphasis and empty states.</span>
</div>
</div></body></html>
